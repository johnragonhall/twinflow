[project]
name = "twinflow-workspace"
version = "0.0.0"
description = "Workspace root. Declares members and shared tooling. Ships no runtime code."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# The root is a workspace container, not a distribution. Saying so explicitly
# keeps uv from looking for a build backend that this file has no reason to
# declare.
package = false
required-version = ">=0.5"
default-groups = ["dev"]

[tool.uv.workspace]
# tools/roadmap is a member and not a package under packages/, because it is not
# part of the twinflow namespace and nothing at run time imports it. It ships as
# its own distribution all the same: A1 says a reader who wants only "roadmap as
# code with a coverage proof" installs one thing and gets it.
members = ["packages/*", "tools/roadmap"]

# Resolve the members named in the dev group from this tree rather than PyPI,
# where they do not exist yet. A new package needs a line here and a line in
# the dev group above; gate WORKSPACE-1 fails the build when a directory under
# packages/ is missing from either.
[tool.uv.sources]
twinflow-schemas = { workspace = true }
twinflow-rng = { workspace = true }
twinflow-kernel = { workspace = true }
twinflow-config = { workspace = true }
twinflow-twin = { workspace = true }
twinflow-sensors = { workspace = true }
twinflow-storage = { workspace = true }
twinflow-agent = { workspace = true }
twinflow-api = { workspace = true }
twinflow-dashboard = { workspace = true }
twinflow-roadmap = { workspace = true }

# One lockfile for every member, so a contributor cannot resolve a different
# numpy than CI did. The numpy pin in each member is a determinism constraint,
# not a compatibility preference: NumPy's published policy allows numpy.random
# stream changes on feature releases.
#
# foundations 5.14 declares a wider group: pytest-asyncio, ty, import-linter,
# schemathesis, griffe, and syrupy. Each arrives with the task that adds the
# code it checks, not ahead of it. ty is invoked through uvx by the typecheck
# recipe in justfile, so it needs no entry here.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyyaml>=6.0",
    # Boundary rules A1.1 to A1.3. The contracts it reads are generated from
    # [tool.twinflow.layers] below by tools/gen_importlinter.py.
    "import-linter>=2.0",
    # The cross-check in packages/twinflow-sensors/tests/test_wire.py drives
    # Google's protobuf runtime over a descriptor built from the field numbers
    # specification 6.4.1 prints. BSD-3-Clause, development only, and never a
    # runtime dependency: nothing in any src/ imports it, and those tests skip
    # rather than fail when it is absent.
    "protobuf>=5",
    # Every workspace member is also a dev dependency of the root, and that is
    # load-bearing rather than tidy. This root is a virtual project, so a plain
    # `uv sync` installs only the root's own dependencies and prunes everything
    # else, and `uv run` syncs the same set before it runs anything. Without
    # these lines `uv run pytest` uninstalls the packages it is about to test
    # and then fails to import them, which reads as a broken test rather than a
    # missing install. Naming the members here makes the ordinary commands work
    # without an --all-packages flag nobody remembers.
    "twinflow-schemas",
    "twinflow-rng",
    "twinflow-kernel",
    "twinflow-config",
    "twinflow-twin",
    "twinflow-sensors",
    "twinflow-storage",
    "twinflow-agent",
    "twinflow-api",
    "twinflow-dashboard",
    "twinflow-roadmap",
]

# Boundary rule A1.3. The layer list and the domain-package list live here and
# nowhere else, because the import-linter contract and the gate both read them
# and two copies would eventually disagree (D-09). `.importlinter` is generated
# from this table by tools/gen_importlinter.py, and its --check mode fails when
# the two drift.
#
# Top of the list imports downward. An import that skips upward fails CI: the
# whole point is that a quality manager can install twinflow-lss without
# dragging in a dashboard.
[tool.twinflow.layers]
order = ["apps", "domain", "storage", "config", "kernel", "rng", "schemas"]
apps = ["api", "dashboard", "cli"]
domain = [
    "twin",
    "lss",
    "sensors",
    "fleet",
    "procmine",
    "forecast",
    "optimize",
    "causal",
    "cv",
    "agent",
]
storage = ["storage"]
config = ["config"]
kernel = ["kernel"]
rng = ["rng"]
schemas = ["schemas"]
# devtools sits outside the graph because nothing imports it at runtime.
outside = ["devtools"]

[tool.pytest.ini_options]
# packages/ holds the distributions. tests/ holds the repository policy gates
# under scripts/checks, which belong to no distribution and would otherwise ship
# untested inside one that does not own them.
testpaths = ["packages", "tools/roadmap", "tests"]
# --import-mode=importlib is load-bearing in a workspace, not a preference.
# Under the default prepend mode pytest imports a test module by its basename,
# so packages/twinflow-schemas/tests/test_import.py and
# packages/twinflow-rng/tests/test_import.py both claim the module name
# test_import. The second one raises "import file mismatch" and aborts
# collection for the whole run, not just for that file. Adding tests/__init__.py
# does not fix it: both then resolve to tests.test_import and collide again.
# Every package here grows a tests/ directory, so same-basename test files are
# the normal case rather than an accident waiting to happen.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "slow: takes more than a second",
    "integration: needs containers",
    "property: Hypothesis property test",
    "brick_isolated: runs against one package installed alone",
]
