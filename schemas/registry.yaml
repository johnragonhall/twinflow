# The schema registry manifest (C3).
#
# Every subject twinflow publishes, the versions that exist, and the status of
# each. A historical version is never deleted: a recorded run refers to the
# version it was written under, and removing that file makes the run unreadable.
#
# The files themselves are generated from their models by tools/gen_schemas.py,
# and `--check` fails when a published file and its model disagree. This
# manifest is hand-maintained, because it carries decisions (status, the
# parallel-publishing window) that no model knows about.

format: 1
dialect: https://json-schema.org/draft/2020-12/schema

subjects:
  envelope:
    description: >-
      The CloudEvents 1.0.2 envelope every twinflow event carries. Doctrine D-07
      settles it in P0, before any subject schema publishes, because adding a
      field afterwards is a major version bump on every subject.
    owner: twinflow-schemas
    versions:
      - version: "1.0"
        file: envelope/v1.json
        status: current
        since: "0.1.0"
        # Set when a successor major exists. SCHEMA-9 reads it and asserts that
        # both majors published at least one sample during the overlap window,
        # so a producer cannot quietly stop publishing the superseded major.
        parallel_until: null

  config/metrics:
    description: >-
      The governed metrics layer (E26b), envelope half. This file owns the
      identifier space, the registry, and the validation rules. The expression
      language and the evaluator belong to the AI layer, so every entry may
      carry a null expression and still validate. The identifier space exists
      from Phase 0 because spec_limits keys resolve against it long before any
      expression computes.
    owner: twinflow-config
    versions:
      - version: "1.0"
        file: config/metrics/v1.json
        status: current
        since: "0.1.0"
        parallel_until: null

  config/facility:
    description: >-
      The bring-your-own-facility contract (A2). One of these describes a site:
      its calendar, its layout, and the flows that move work through it. The
      loader validates against this published file rather than against a second
      copy expressed in Python, so the schema an author reads and the schema the
      loader enforces are one artefact.
    owner: twinflow-config
    versions:
      - version: "1.0"
        file: config/facility/v1.json
        status: current
        since: "0.1.0"
        parallel_until: null
