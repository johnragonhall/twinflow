# The roadmap, as data.
#
# ROADMAP.md is the readable projection of this file and GitHub is the public
# one. Nobody edits a generated section and nobody opens a roadmap issue by
# hand.
#
# Two dependency namespaces, not one: depends_on_phases names phases and
# requires_requirements names requirements. The source's own ordering arguments
# mix the two freely, and one list holding both leaves the validator guessing
# which namespace a token belongs to.
#
# exit_gates is derived from gates.yaml and never authored here. Authoring it is
# a load error, which is what stops the phase table and the gate registry
# drifting apart.
#
# partial on a coverage entry means a later work package also covers that
# requirement. The last one carries partial: false, and that is the invariant
# the coverage proof reads.

version: 1

phases:
  - id: P0
    name: "Contracts"
    delivers: >-
      Determinism at both tiers, the sim clock, the schema registry and the event envelope, test
      tiers, config validation, release automation, monorepo tooling, package topology, the
      governed metrics layer, the environment driver seam, and the roadmap tool.
    depends_on_phases: []
    requires_requirements: []
    release_tag: v0.1.0
  - id: P1
    name: "Walking skeleton"
    delivers: >-
      One station end to end, from two devices publishing Sparkplug B into the UNS to a
      dashboard tile and one agent tool, with the release pipeline producing the tag.
    depends_on_phases: [P0]
    requires_requirements: []
    release_tag: v0.2.0
  - id: P2
    name: "The judge"
    delivers: >-
      The Lean Six Sigma engine as the thing that judges both the telemetry and the twin, and
      the browser replay demo that lets a reader watch it without installing anything.
    depends_on_phases: [P1]
    requires_requirements: []
    release_tag: v0.3.0
  - id: P3
    name: "Breadth and the business loop"
    delivers: >-
      Sensor breadth on the catalog pattern, the predictive maintenance layer, the loop out to
      the business systems, and the physical model behind every RFID read.
    depends_on_phases: [P2]
    requires_requirements: []
    release_tag: v0.4.0
  - id: P3b
    name: "Automation and robotics"
    delivers: >-
      The operator model, the energy layer, and the optimizer first, then the automation the
      what-if questions are about.
    depends_on_phases: [P3]
    requires_requirements: []
    release_tag: v0.5.0
  - id: P3c
    name: "Process mining and VSM"
    delivers: >-
      Process mining scored against a known ground-truth process model, and the Lean deliverable
      consultants draw by hand.
    depends_on_phases: [P3b]
    requires_requirements: []
    release_tag: v0.6.0
  - id: P3d
    name: "Planning"
    delivers: >-
      The loop from execution back to planning, and the yard schedule as a controllable lever.
    depends_on_phases: [P3c]
    requires_requirements: ["E9"]
    release_tag: v0.7.0
  - id: P3e
    name: "Supplier and outbound"
    delivers: >-
      The inbound side gains a supply base with behavior, and the outbound side completes the
      end-to-end flow.
    depends_on_phases: [P3d]
    requires_requirements: []
    release_tag: v0.8.0
  - id: P3f
    name: "Returns"
    delivers: >-
      The reverse flow, competing with inbound for the same doors, labor, and staging space.
    depends_on_phases: [P3e]
    requires_requirements: []
    release_tag: v0.9.0
  - id: P3g
    name: "Cross-dock and e-commerce"
    delivers: >-
      The flow-through mode and the second order profile, and the contention between them.
    depends_on_phases: [P3e]
    requires_requirements: ["E12"]
    release_tag: v0.10.0
  - id: P3h
    name: "Transport and MEIO"
    delivers: "The network above the four walls, and the question of where safety stock lives."
    depends_on_phases: [P3g]
    requires_requirements: []
    release_tag: v0.11.0
  - id: P3i
    name: "Upstream production"
    delivers: >-
      The chain's origin, modeled from the inside as a hybrid batch and discrete factory.
    depends_on_phases: [P3h]
    requires_requirements: []
    release_tag: v0.12.0
  - id: ECON
    name: "Economics prerequisites"
    delivers: "The four economic contracts that six of the eight 6a1x layers consume."
    depends_on_phases: [P3i]
    requires_requirements: []
    release_tag: v0.13.0
  - id: 6a10
    name: "Safety and ergonomics"
    delivers: "The human layer made measurable in the same units as the machines."
    depends_on_phases: [ECON]
    requires_requirements: ["E6"]
    release_tag: v0.14.0
  - id: 6a11
