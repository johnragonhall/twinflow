    depends_on_phases: [CAUSAL, 6a12, 6a14]
    requires_requirements: ["E21"]
    release_tag: v0.24.0
  - id: SOE
    name: "Sales and operations execution"
    delivers: "The control-tower loop between the monthly plan and the week that happened."
    depends_on_phases: [6a16]
    requires_requirements: []
    release_tag: v0.25.0
  - id: 6a17
    name: "Finance and accounting"
