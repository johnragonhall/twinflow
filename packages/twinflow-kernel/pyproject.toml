[project]
name = "twinflow-kernel"
description = "The DST seam: the ports every other package takes as a parameter, and the deterministic implementations behind them."
requires-python = ">=3.12"
# Core install stays at pydantic and numpy plus the two workspace leaves, and
# that is a boundary rule rather than a preference: a quality manager who
# installs only twinflow-lss gets what they already have, and no columnar,
# database, or broker library. Every concrete storage adapter belongs to
# twinflow-storage (foundations 2.2 and 2.7).
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1,<3",
    "twinflow-schemas",
    "twinflow-rng",
]

# Read from the module, so __version__ and the distribution metadata are one
# value and cannot disagree.
dynamic = ["version"]

license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[build-system]
# 1.27 is where hatchling accepts the PEP 639 license fields above.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/twinflow/kernel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/twinflow"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.py[co]", "**/.pytest_cache"]

[tool.uv.sources]
twinflow-schemas = { workspace = true }
twinflow-rng = { workspace = true }
