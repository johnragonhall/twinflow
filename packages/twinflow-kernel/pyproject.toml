[project]
name = "twinflow-kernel"
description = "The DST seam: the ports every other package takes as a parameter, and the deterministic implementations behind them."
requires-python = ">=3.12"
# Core install stays at pydantic and numpy plus the two workspace leaves, and
# that is a boundary rule rather than a preference: a quality manager who
# installs only twinflow-lss gets what they already have, and no columnar,
# database, or broker library. Every concrete storage adapter belongs to
# twinflow-storage (foundations 2.2 and 2.7).
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1,<3",
    "twinflow-schemas",
    "twinflow-rng",
]

# Read from the module, so __version__ and the distribution metadata are one
# value and cannot disagree.
dynamic = ["version"]

license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# Reading a scenario off disk needs a YAML parser, and foundations 2.2 holds the
# core install to pydantic and numpy. So the parser is an extra rather than a
# dependency: `pip install twinflow-kernel` stays the small thing D-10 asks for,
# and anybody who runs a scenario file asks for the extra. load_scenario imports
# yaml inside the function and names the extra when it is absent, so the failure
# is an instruction rather than an ImportError.
[project.optional-dependencies]
scenario = ["pyyaml>=6"]
# The production half of the NETWORK seam, per ADR-0003. An extra rather than a
# dependency, under doctrine D-10: simulation mode never opens a socket, so a
# reader taking this brick to run a scenario resolves nothing new. paho-mqtt is
# `EPL-2.0 OR BSD-3-Clause` and this project takes the BSD-3-Clause half; the
# record says so, because nothing in the resolved metadata does.
mqtt = ["paho-mqtt>=2.1,<3"]

[build-system]
# 1.27 is where hatchling accepts the PEP 639 license fields above.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/twinflow/kernel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/twinflow"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.py[co]", "**/.pytest_cache"]

[tool.uv.sources]
twinflow-schemas = { workspace = true }
twinflow-rng = { workspace = true }
