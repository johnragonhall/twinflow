[project]
name = "twinflow-twin"
description = "The discrete-event process twin of receiving and putaway."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1,<3",
    # ARCH-1, decision D1. SimPy is the pinned discrete-event framework, and
    # the upper bound is a determinism constraint rather than a compatibility
    # preference: the scheduler's heap key is part of the recorded tape, so a
    # major release free to reorder simultaneous events would silently rewrite
    # every golden hash.
    "simpy>=4.1.2,<5",
    "twinflow-kernel",
    "twinflow-rng",
    "twinflow-schemas",
]

# Read from the module, so __version__ and the distribution metadata are one
# value and cannot disagree.
dynamic = ["version"]

license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[build-system]
# 1.27 is where hatchling accepts the PEP 639 license fields above.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/twinflow/twin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/twinflow"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.py[co]", "**/.pytest_cache"]

[tool.uv.sources]
twinflow-kernel = { workspace = true }
twinflow-rng = { workspace = true }
twinflow-schemas = { workspace = true }
