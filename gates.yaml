# The gate registry.
#
# Every gate id in ROADMAP.md section 7 is declared here at Phase 0 with its id,
# its first phase, its kind, its standing flag, and the section that owns it.
# Declaring the whole set this early is what forces a subsystem section to
# specify its gates one phase ahead of implementing them: `roadmap validate`
# fails when a work package in the open phase or the next one references a gate
# still at status declared.
#
# Validation is scoped by status, because a gate declared at P0 has no test on
# disk and no assertion yet:
#
#   declared     unique id, first_phase resolves, standing present
#   specified    plus assertion, falsified_by, and the kind's required fields
#   implemented  plus test_path exists on disk
#
# Kind and first phase come from ROADMAP.md section 7 wherever that file carries
# the row, because that file is the authority on gate identity and states the
# D-11 conditions each row meets. The rest take theirs from
# docs/design/roadmap.md section 7.4, which is where the policy and budget kinds
# are used.
#
# Gate ids are never renamed. Release notes cite them.

version: 1
