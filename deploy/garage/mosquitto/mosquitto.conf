# Broker configuration for the garage tier.
#
# Rule 5 of ARCHITECTURE.md section 7, the static half: identity, not location.
# A device authenticates with an mTLS client certificate issued by the internal
# CA, and the common name on that certificate becomes the username the ACL file
# is keyed on. Position on the OT segment grants nothing on its own.
#
# Two listeners, because the broker is the single crossing point and the two
# sides of it are not the same trust zone.

per_listener_settings false

# --------------------------------------------------------------------------
# Device listener, reached from the OT segment
# --------------------------------------------------------------------------
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/broker.crt
keyfile /mosquitto/config/certs/broker.key
tls_version tlsv1.3

# --------------------------------------------------------------------------
# North listener, read by the IT segment
# --------------------------------------------------------------------------
listener 8884
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/broker.crt
keyfile /mosquitto/config/certs/broker.key
tls_version tlsv1.3

# --------------------------------------------------------------------------
# Identity and authorization
# --------------------------------------------------------------------------

# No client connects without a certificate the internal CA signed.
require_certificate true

# The certificate common name is the username. This is what makes the ACL file
# a statement about identity rather than about which network a container sits
# on. A device that steals another device's address still cannot publish under
# that device's prefix.
use_identity_as_username true

# Belt and braces beside require_certificate. Both have to be wrong before an
# unauthenticated client reaches a topic.
allow_anonymous false

# Deny by default. A topic no rule in this file grants is refused.
acl_file /mosquitto/config/acl

# --------------------------------------------------------------------------
# Persistence
# --------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Cross-zone traffic is logged so an anomalous flow becomes a finding in the
# same stream as a bearing trend or an SPC violation.
connection_messages true
