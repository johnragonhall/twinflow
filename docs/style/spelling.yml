# Whole words, where a stem would reach a word that is correct in both. Every
# doubled-l inflection lives here, so cancellation is never touched.
british_words:
  # The -re and -ogue families drop the e before a vowel suffix, so a stem rule
  # would turn centred into centerd and catalogued into catalogd. Their
  # inflections are written out instead.
  centre: center
  centres: centers
  centred: centered
  centring: centering
  fibre: fiber
  fibres: fibers
  calibre: caliber
  calibres: calibers
