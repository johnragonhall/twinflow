# The proof, beside the rules it proves.
#
# `fires` is what each family must catch, with the suggestion it must make.
# `passes` is the other half, and it is the half that matters: every word here
# is correctly spelled and sits one careless stem rule away from being rewritten
# into something that is not a word. Both lists live here rather than in the
# gate or its test, because this is the one file the gate does not read for
# findings, so it is the one file that can hold a wrong spelling on purpose.
selftest:
  fires:
    colour: color
    behaviour: behavior
    normalise: normalize
    serialised: serialized
    licence: license
    centre: center
    centred: centered
    catalogued: cataloged
    artefact: artifact
    labelled: labeled
    cancelled: canceled
    fulfilment: fulfillment
    whilst: while
    metres: meters
    grey: gray
    analysed: analyzed
    programme: program
    recieve: receive
    seperate: separate
    occured: occurred
    definately: definitely
    teh: the
  passes:
    - cancellation
    - hypothesis
    - analysis
    - analyses
    - specialist
    - capitalist
    - rationalist
    - totally
    - realistic
    - instilled
    - distilled
    - programmer
    - programming
    - parameter
    - diameter
    - collaborate
    - advertise
    - compromise
    - exercise
    - franchise
    - surprise
    - practice
    - contour
    - detour
    - license
    - center
    - color
