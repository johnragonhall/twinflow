# The spelling rules, in one place.
#
# scripts/checks/spelling-gate.py applies these and owns none of them, which is
# the same arrangement the prose gate has with banned-phrases.yml: a rule lives
# in exactly one file, so a fix to a rule is a diff a reviewer can read.
#
# Two kinds of rule. `british` converts a spelling variant. `typos` corrects a
# misspelling. Both are errors, because a word that is wrong is wrong wherever
# it appears, and a warning that never fails anything is a warning nobody reads.
#
# ESCAPE
#
#   spell-ok <word> <reason>
#
# on the same line, and the reason is not optional. A gate that is easy to
# silence is not a gate. Use it where the word is somebody else's: a third-party
# API named `serialise`, a quoted title, a URL.
#
# WHY THE -ISE RULES CARRY SUFFIXES
#
# A bare stem is what turns hypothesis into hypothesiz, specialist into
# specializt, and totally into totaly. Every -ise verb below converts only in
# front of a suffix that follows the verb, and the doubled-l words list their
# inflections rather than matching a stem. The selftest asserts both halves:
# that the rules fire on the British form, and that they leave cancellation,
# hypothesis, analysis, specialist, and totally alone.

version: 1

# Paths the gate never reads. LICENSE and NOTICE carry verbatim legal text that
# a byte comparison in the workspace gate depends on, and this file holds the
# words the rules reject.
skip_paths:
  - LICENSE
  - NOTICE
  - sbom.cdx.json
  - uv.lock
  - docs/style/spelling.yml
  - docs/style/ste-terms.yml
  - docs/style/banned-phrases.yml

# The suffixes an -ise verb takes. A stem below converts in front of one of
# these and nowhere else.
ise_suffixes: [e, ed, es, ing, er, ers, ation, ations, able, ability]

# -ise verbs. Written as the British stem; the American form swaps the final s
# for a z, and the suffix is carried through unchanged.
ise_stems:
  - normalis
  - optimis
  - serialis
  - utilis
  - organis
  - recognis
  - prioritis
  - summaris
  - specialis
  - minimis
  - maximis
  - authoris
  - standardis
  - synchronis
  - initialis
  - randomis
  - customis
  - capitalis
  - generalis
  - characteris
  - parameteris
  - categoris
  - visualis
  - formalis
  - modularis
  - penalis
  - stabilis
  - realis
  - centralis
  - decentralis
  - amortis
  - apologis
  - criticis
  - digitis
  - equalis
  - familiaris
  - harmonis
  - hypothesis
  - emphasis
  - idealis
  - itemis
  - legitimis
  - localis
  - mechanis
  - memoris
  - mobilis
  - modernis
