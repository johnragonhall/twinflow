  manoeuvres: maneuvers
  manoeuvred: maneuvered
  manoeuvring: maneuvering
  catalogue: catalog
  catalogues: catalogs
  catalogued: cataloged
  cataloguing: cataloging
  # programme is a whole word because programmer and programming share its
  # first nine letters and are correct.
  programme: program
  programmes: programs
  # analyses is the plural of the noun analysis, so this family cannot go in
