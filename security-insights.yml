# OpenSSF Security Insights, schema version 2.2.0.
#
# Machine-readable security metadata for this repository. The specification is
# published by the OpenSSF at https://github.com/ossf/security-insights-spec.
#
# Every field below states something this repository does today. A capability
# that is planned rather than present is absent from this file or carries a
# comment saying so, on the same rule the metric markers follow: no claim
# without the thing behind it.

header:
  schema-version: 2.2.0
  last-updated: "2026-08-13"
  last-reviewed: "2026-08-13"
  url: https://github.com/johnragonhall/twinflow/raw/main/security-insights.yml
  comment: |
    Single-repository file. twinflow is a uv workspace holding several packages
    in one repository, so the project and repository sections both live here.

project:
  name: twinflow
  homepage: https://github.com/johnragonhall/twinflow
  roadmap: https://github.com/johnragonhall/twinflow/blob/main/ROADMAP.md
  administrators:
    - name: John Ragon Hall
      affiliation: none, this is independent work
      social: https://github.com/johnragonhall
      primary: true
  documentation:
    code-of-conduct: https://github.com/johnragonhall/twinflow/blob/main/CODE_OF_CONDUCT.md
    support-policy: https://github.com/johnragonhall/twinflow/blob/main/SUPPORT.md
  repositories:
    - name: twinflow
      url: https://github.com/johnragonhall/twinflow
      comment: |
        The only repository. Packages are workspace members inside it, and each
        one installs on its own.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/johnragonhall/twinflow/blob/main/SECURITY.md
    contact:
      name: GitHub private vulnerability reporting, at the repository security advisories page
      primary: true
    comment: |
      Reports go through GitHub private vulnerability reporting rather than
      email. SECURITY.md states the fallback when the button is missing, and
      names a first-reply target of 7 days.

repository:
  url: https://github.com/johnragonhall/twinflow
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: John Ragon Hall
      affiliation: none, this is independent work
      social: https://github.com/johnragonhall
      primary: true
  documentation:
    contributing-guide: https://github.com/johnragonhall/twinflow/blob/main/CONTRIBUTING.md
    review-policy: https://github.com/johnragonhall/twinflow/blob/main/docs/code-review.md
    security-policy: https://github.com/johnragonhall/twinflow/blob/main/SECURITY.md
    governance: https://github.com/johnragonhall/twinflow/blob/main/CONTRIBUTING.md#governance
    dependency-management-policy: https://github.com/johnragonhall/twinflow/blob/main/LICENSING.md
  license:
    url: https://github.com/johnragonhall/twinflow/blob/main/LICENSE
    expression: Apache-2.0
    comment: |
      Apache-2.0 is the outbound open source license. A separately negotiated
      commercial license is also offered, and LICENSING.md covers both. The
      expression above names the open option, which is the one that governs
      redistribution of this repository.
  release:
    changelog: https://github.com/johnragonhall/twinflow/blob/main/CHANGELOG.md
    attestations:
      - name: Build provenance
        predicate-uri: https://slsa.dev/provenance/v1
        location: https://github.com/johnragonhall/twinflow/attestations
        comment: |
          Generated by actions/attest-build-provenance in the release workflow.
      - name: CycloneDX SBOM
        predicate-uri: https://cyclonedx.org/bom
        location: https://github.com/johnragonhall/twinflow/blob/main/sbom.cdx.json
        comment: |
          Committed in the tree and attached to a release. VAL-GATE-SEC-001
          fails a release whose SBOM is missing.
    distribution-points:
      - uri: https://github.com/johnragonhall/twinflow/releases
        comment: GitHub release page
    comment: |
      The release workflow cuts every tag from one pipeline. Work package
      WP-P0-14, running that ritual unattended from a tag, is open at the time
      of writing, so automated-pipeline is left unset rather than asserted.
  security:
    assessments:
      self:
        comment: |
          No security self assessment has been completed. This field is present
          and empty on purpose: docs/code-review.md section 6 records the
          OpenSSF gold criterion for a security review within five years as
          unmet, and this file agrees with that page rather than contradicting
          it.
    champions:
      - name: John Ragon Hall
        primary: true
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Runs from .github/workflows/codeql.yml and uploads SARIF to code
          scanning.
      - name: OpenSSF Scorecard
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Runs from .github/workflows/scorecard.yml and uploads SARIF.
      - name: Dependabot
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Configured in .github/dependabot.yml.
      - name: pip-audit
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: true
        comment: |
          VAL-GATE-SEC-001 needs pip-audit clean, or waived with an expiry date,
          before a release tag.
      - name: zizmor
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Static analysis of the GitHub Actions workflows, configured in
          .zizmor.yml.
    comment: |
      A license allowlist gate refuses any resolved dependency outside the
      permissive set that CONTRIBUTING.md names, with one MPL-2.0 row scoped to
      development dependencies. Technology decision D15 in ARCHITECTURE.md
      records the policy and its reasoning.
