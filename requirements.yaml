# The requirement register (CON-6).
#
# Append-only. One entry per requirement id, and an entry is never removed and
# never reworded. There is no status field and no cut list: an idea that turns
# out to belong somewhere else is reordered in roadmap.yaml, and section 5 of
# ROADMAP.md records the move.
#
# Source atoms only. A split label such as E4a is not an entry here, because the
# source carries only E4. Split labels live in splits.yaml and reach a work
# package through the note on a coverage entry.
#
# quote and source_line carry the clause that defines a requirement, verbatim,
# and the line it sits on in the source document. They are absent here because
# the source document is not in this repository. The loader accepts an absent
# quote and refuses a changed one, so filling them in later is an append, and
# `roadmap coverage --quotes` reports how many are still missing.

