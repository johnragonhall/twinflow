site_name: twinflow
site_description: >-
  A deterministic digital-twin simulation of a manufacturing and distribution
  operation, runnable either as real containers or as one reproducible process.
site_url: https://johnragonhall.github.io/twinflow/
repo_url: https://github.com/johnragonhall/twinflow
repo_name: johnragonhall/twinflow
edit_uri: edit/main/docs/

# Serve with:  uv run mkdocs serve
# Build with:  uv run mkdocs build --strict
#
# --strict turns a broken link or a missing nav target into a build failure,
# which is what keeps the nav below honest as pages land.
#
# mkdocs only serves files under docs_dir. README, ARCHITECTURE, ROADMAP,
# CONTRIBUTING, SECURITY, CODE_OF_CONDUCT, and CHANGELOG stay at the repository
# root because that is where GitHub looks for them, and they are read there.
# They are not mirrored into the site: their links are written for the GitHub
# tree, and re-basing them for a second layout would leave two link schemes to
# keep correct. The site hosts the design specification, which is the part that
# benefits from search and navigation, and links out for the rest.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    # The palette toggle matters here: most of the diagrams are read on a
    # laptop in a bright room and on a projector in a dark one.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # mkdocstrings generates the API reference from the docstrings in the package,
  # so the reference cannot drift from the code it describes. It is commented
  # out until the first package exists, because a plugin that reads docstrings
  # from nothing fails the strict build and blocks the docs site the roadmap
  # already depends on. Milestone C10 turns it back on with the Reference entry
  # in the nav. Config kept verbatim so turning it on is uncommenting.
  #
  # - mkdocstrings:
  #     handlers:
  #       python:
  #         options:
  #           docstring_style: google
  #           show_source: true
  #           show_signature_annotations: true
  #           separate_signature: true
  #           merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Start here:
      - Reading guide: reading-guide.md
      - Glossary: glossary.md
  - Design specification:
      - Doctrine: design/DOCTRINE.md
      - Foundations: design/foundations.md
      - Variability and faults: design/variability-and-faults.md
      - Process twin: design/twin-core.md
      - IoT fleet: design/iot-fleet.md
      - Sensor catalog: design/sensor-catalog.md
      - Statistical engine: design/lss-engine.md
      - Planning and supply: design/planning-supply.md
      - Production and quality: design/production-quality.md
      - Back office: design/back-office.md
      - People and sustainability: design/human-sustain.md
      - AI layer: design/ai-layer.md
      - Dashboard and replay: design/dashboard-replay.md
      - Interface direction: design/ui-direction.md
      - Repository craft: design/repo-craft.md
      - Phase detail: design/roadmap.md
  - Reference:
      - Layer map: reference/layer-map.md
  - Validation gates: gates.md
  - Decision records:
      - Index: adr/index.md
      - ADR-0001 Record architecture decisions: adr/0001-record-architecture-decisions.md
      - ADR-0002 Implement the agent seam: adr/0002-implement-the-agent-seam-rather-than-adopt-pydantic-ai.md
      - Template: adr/template.md
  - Working here:
      - Performance standard: performance.md
      - Testing strategy: testing-strategy.md
      - Testing policy: testing-policy.md
      - Test index: tests.md
      - Code review policy: code-review.md
      - Documentation standard: DOCUMENTATION-STANDARD.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/johnragonhall/twinflow

# No analytics, no tracking, no third-party fonts. A documentation site that
# phones home is a documentation site nobody can host behind a firewall.
