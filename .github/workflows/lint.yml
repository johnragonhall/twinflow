name: Lint

# Repo-wide backstop for the pre-commit hook.
#
# The hook only ever sees staged files, and it warn-skips any linter that is
# not installed on the contributor's machine. This workflow is where the same
# rules are enforced over the whole tree with every tool guaranteed present, so
# a partial local toolchain can never let a finding through.
#
# Runs GitHub-hosted on purpose. GitHub documents Actions usage as free for
# public repositories on standard GitHub-hosted runners, and twinflow is public.
# Larger runners are billed even on a public repository, so nothing here asks
# for one. See the cost note at the top of ci.yml.
# Source: https://docs.github.com/en/billing/concepts/product-billing/github-actions
# retrieved 2026-08-09.
#
# Wall-time budget: under 4 minutes. Everything here is a static check with no
# build step.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Repo-wide lint and policy gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checkout token is not needed past this step, and a
          # workspace that still holds it leaks it into any artifact
          # uploaded later.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install linters
        run: |
          # The prose gate reads its rules from docs/style/*.yml.
          python -m pip install --upgrade pip
          pip install pyyaml
          mkdir -p bin
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest bin

      # docs/DOCUMENTATION-STANDARD.md, enforced from docs/style/*.yml over the
      # whole tree. --all because the hook only ever sees staged lines.
      # IP hygiene, repo-wide. The pre-commit hook runs the staged half, and
      # `--no-verify` skips it the way it skips every hook. This is the only
      # unconditional run: `just lint` also carries it, but ci.yml path-filters
      # that job, so a documents-only commit reaches no other copy. A client
      # name in a public history costs a rewrite, so it gets a job that always
      # runs rather than one that usually does.
      - name: IP hygiene gate (repo-wide)
        run: python scripts/checks/banned-terms-gate.py --all

      - name: Prose gate (repo-wide)
        run: python scripts/checks/prose-gate.py --all

      # Determinism policy: no direct clock, RNG, or socket calls outside the
      # kernel adapter package. --all for the same reason.
      - name: Nondeterminism gate (repo-wide)
        run: sh scripts/checks/nondeterminism-gate.sh --all

      # WORKSPACE-1. A package under packages/ that is not also a root dev
      # dependency is uninstalled by the same `uv run` that is about to test it.
      - name: Workspace membership gate
        run: python scripts/checks/workspace-members-gate.py

      # IMPORT-2 and IMPORT-3. Reads source with ast, so it needs no install.
      # The A1.1 to A1.3 contracts need the workspace importable and run in the
      # python job instead.
      - name: Import boundary gate
        run: python scripts/checks/import-boundary-gate.py

      - name: Import contracts are generated from the layer table
        run: python tools/gen_importlinter.py --check

      # Report mode. An unfilled metric marker is normal during the build and
      # only becomes fatal on a release tag, where --release is passed.
      - name: Metric marker gate
        run: sh scripts/checks/metric-marker-gate.sh

      - name: Changelog sync selftest
        run: sh scripts/changelog-sync.sh --selftest

      # Same glob as scripts/ci-local.sh. Ignored trees are dropped by the
      # gitignore setting in .markdownlint-cli2.jsonc, not by negations here.
      - name: Markdown (markdownlint-cli2)
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Shell (shellcheck)
        run: |
          # The list comes from one place, so this job and scripts/ci-local.sh
          # cannot check different files. A glob over scripts/hooks/ would
          # reach comment_judge.py, and that file is Python.
          files=$(sh scripts/checks/shell-files.sh)
          if [ -z "$files" ]; then
            echo "no shell scripts"
            exit 0
          fi
          # Word splitting is intended: shellcheck takes a list of paths.
          # shellcheck disable=SC2086
          shellcheck $files

      - name: GitHub Actions (actionlint)
        run: ./bin/actionlint -color

  # Milestone C13, gate VAL-GATE-CLA-001. Runs the three checks CLA.md section
  # 7 publishes. It runs only on a pull request, because two of the three read
  # the pull request author and the commit range.
  #
  # The rules are not written here. scripts/checks/cla-gate.py holds them and
  # reads the signatory expression out of CLA.md itself, so the document a
  # contributor reads and the check that refuses their pull request cannot
  # disagree. That also makes all three runnable from a checkout, which is what
  # lets the phase-exit runner arm this gate.
  cla:
    name: Contributor agreement
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checkout token is not needed past this step, and a workspace
          # that still holds it leaks it into any artifact uploaded later.
          persist-credentials: false
          # Check 3 walks the commit range, so the shallow default is not
          # enough. On a pull request this checks out the merge result, so
          # CLA.md holds the signatory line this pull request adds.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # A gate nobody has seen fail may be passing because it cannot fail.
      # This runs the checker against malformed signatures it must refuse,
      # before the checker is trusted to judge a real one.
      - name: Gate selftest
        run: python scripts/checks/cla-gate.py --selftest

      - name: Line shape
        run: python scripts/checks/cla-gate.py line-shape

      - name: Signature present
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: python scripts/checks/cla-gate.py signature --author "$AUTHOR" --owner "$OWNER"

      - name: Trailer present
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # On a pull request, actions/checkout leaves HEAD at the merge
          # commit: parent 1 is the base branch tip, parent 2 is the pull
          # request head. Deriving the range from those two parents excludes
          # commits merged in from the base branch, which the contributor did
          # not write and cannot sign. The payload SHAs are the fallback for
          # the case where no merge commit exists.
          if base_tip=$(git rev-parse --verify --quiet "HEAD^1") &&
             pr_head=$(git rev-parse --verify --quiet "HEAD^2"); then
            echo "range taken from the merge commit parents"
          else
            base_tip=$BASE
            pr_head=$HEAD
            echo "no merge commit, falling back to the payload SHAs"
          fi
          python scripts/checks/cla-gate.py trailers --range "$pr_head --not $base_tip"

  # REG-001. A fix ships with the test that catches it.
  #
  # A separate job because it walks a commit range, and the repo-wide lint job
  # checks out shallow. It runs on push as well as on a pull request: the rule
  # is about what reaches the log, and the commit-msg hook is skippable with
  # --no-verify, so the branch is where the claim is actually settled.
  regression:
    name: Regression tests accompany fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checkout token is not needed past this step, and a workspace
          # that still holds it leaks it into any artifact uploaded later.
          persist-credentials: false
          # The gate walks v0.1.0..HEAD, so it needs the history and the tag.
          # A shallow checkout would hand it one commit, which is a range
          # nothing can fail.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # A gate nobody has seen fail may be passing because it cannot fail.
      # Nine cases, two of which expect a finding.
      - name: Gate selftest
        run: python scripts/checks/regression-test-gate.py --selftest

      - name: Every fix since the baseline carries a test
        run: python scripts/checks/regression-test-gate.py --range v0.1.0..HEAD
