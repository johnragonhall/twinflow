name: Release

# The release ritual, run in the order docs/design/roadmap.md section 5.11 sets,
# and any failure aborts before the tag is pushed.
#
# WHY THIS EXISTS AT v0.1.0
# -------------------------
# v0.1.0 comes out of the same pipeline as v1.6.0, or the release history is
# inconsistent under exactly the inspection a reviewer performs. Building the
# pipeline at the first tag costs an afternoon; reconstructing four earlier
# releases to match a pipeline written later costs the claim that they were
# reproducible.
#
# STEPS THAT CANNOT RUN YET
# -------------------------
# Three ritual steps need artifacts a later phase produces: the README headline
# metric, which needs a seeded run P1 delivers; the E1 replay bundle, from
# v0.3.0; and the A4 load harness, from v0.4.0. Each is a step here, each names
# the tag that arms it, and each prints why it did nothing. A skipped step that
# prints nothing is a step a reader assumes ran.
#
# WHAT IT MUTATES
# ---------------
# Milestone lifecycle only, which is the one class of tracker change
# .roadmap-sync.yaml lets a workflow apply without a human. Issue mutation waits
# for `just roadmap sync --apply` from a checkout.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to cut, without the leading v (for example 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Run every check and build nothing that leaves the runner"
        required: false
        default: true
        type: boolean
      publish:
        description: "Publish the wheels to PyPI. Needs the trusted publisher configured first"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Every value a shell step reads, declared once. A `${{ }}` expression
    # inside a `run:` block is expanded by the workflow engine before the shell
    # sees it, so a value carrying shell syntax becomes shell syntax. Through
    # the environment it stays a string: parameter expansion cannot become code.
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      COMMIT_SHA: ${{ github.sha }}
    permissions:
      contents: write
      issues: write
      # Trusted publishing to PyPI, and the Sigstore signing identity behind
      # the build provenance. No token is stored anywhere in this repository,
      # which is why the publish step reads no secret.
      id-token: write
      # SLSA build provenance. The attestation binds each artifact's digest to
      # this workflow, this commit, and this runner, signed by a certificate
      # that lives for the length of the job.
      attestations: write
    steps:
      # This job keeps the checkout credential because step 11 pushes the tag
      # it creates. .github/zizmor.yml records why that is safe here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release gate reads the CHANGELOG against the tag history, and
          # the roadmap history test walks every commit that touched
          # requirements.yaml. Both need more than one commit.
          fetch-depth: 0

      - name: Check the version is semver and the tag is free
        run: |
          version="$VERSION"
          case "$version" in
            v*) echo "::error::pass the version without the leading v"; exit 1 ;;
          esac
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::$version is not semver MAJOR.MINOR.PATCH"; exit 1; }
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::v$version already exists. A tag is never moved."
            exit 1
          fi

      # No cache on the release path, deliberately.
      #
      # A cache is writable by any run that can reach the same key, including a
      # pull-request run from a fork. Restoring one here would let a build the
      # maintainer never reviewed put bytes into the artifacts this job signs
      # and publishes, and the provenance attestation would faithfully attest
      # to those bytes. A few minutes of cold install is the correct price for
      # a release whose inputs came only from the commit being released.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The phase this tag releases, from roadmap.yaml rather than from an
      # input. A version and a phase that disagree is a release record naming
      # gates the release did not run.
      - name: Resolve the phase this tag releases
        id: phase
        run: |
          phase=$(uv run python -c "
          import os, sys, yaml
          tag = 'v' + os.environ['VERSION']
          data = yaml.safe_load(open('roadmap.yaml', encoding='utf-8'))
          for entry in data['phases']:
              if entry['release_tag'] == tag:
                  print(entry['id'])
                  break
          else:
              sys.exit(f'no phase in roadmap.yaml releases {tag}')
          ")
          echo "id=$phase" >> "$GITHUB_OUTPUT"
          echo "v$VERSION releases phase $phase"

      # 1. Lint, types, and the unit tier.
      - name: Step 1, just check
        run: just check

      # 2. The property tier, within its runtime budget.
      - name: Step 2, property invariants
        run: just test-property

      # 3. The end-to-end tier: SCN-F1 runs, its log satisfies the envelope
      #    invariants, and three runs at one seed hash the same.
      - name: Step 3, end-to-end tier
        run: just test-e2e

      # 4. The phase-exit suite. The gate runner is WP-P0-15; until it lands,
      #    the gates that do exist run individually rather than through it.
      - name: Step 4, phase-exit gates
        env:
          RELEASE_PHASE: ${{ steps.phase.outputs.id }}
        run: just gate phase-exit "$RELEASE_PHASE"

      - name: Step 4b, roadmap drift against the tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run twinflow-roadmap drift

      # 5. The README headline number is regenerated from a seeded run, never
      #    edited. There is no run to seed until P1 ships one.
      - name: Step 5, regenerate the README headline metric
        run: |
          echo "SKIP: no seeded run exists before P1, so there is no measured number to write."
          echo "The metric marker gate below fails a marker that claims one anyway."
          sh scripts/checks/metric-marker-gate.sh --release "$VERSION"

      # 6 and 7. Release-only work that starts at later tags.
      - name: Step 6, re-record the E1 replay bundle
        run: |
          echo "SKIP: VAL-GATE-E1-001 applies from v0.3.0."

      - name: Step 7, re-run the A4 load harness
        run: |
          echo "SKIP: VAL-GATE-PERF-001 applies from v0.4.0."

      # 8. Every generated artifact is regenerated and the tree is asserted
      #    clean over those paths and no others. Regenerating rather than only
      #    checking is the point: a tag that shipped a stale gate table would
      #    publish a promise the registry does not make.
      - name: Step 8, generated artifacts are current
        run: |
          uv run python tools/gen_schemas.py --check
          uv run python tools/gen_importlinter.py --check
          uv run twinflow-roadmap graph-lint
          uv run twinflow-roadmap render
          git diff --exit-code -- ROADMAP.md docs/gates.md schemas .importlinter

      # 9. SBOM, license allowlist, and the wheels.
      # Both tools name their target explicitly. `uvx` resolves a tool into its
      # own isolated environment, and both `pip-audit` with no argument and
      # `cyclonedx-py environment` with no path read the environment their own
      # interpreter lives in, which under `uvx` is the tool's. `sbom-gate.py`
      # then reads the resulting document against the lock, so the target being
      # right is asserted rather than assumed.
      - name: Step 9, SBOM and license allowlist
        run: |
          uv run python scripts/checks/license-allowlist-gate.py
          uvx cyclonedx-py environment .venv > sbom.cdx.json
          uv run python scripts/checks/sbom-gate.py sbom.cdx.json
          uv run --with pip-audit pip-audit

      # 9b. Every brick, built twice into separate directories and compared.
      #
      #     This project asserts that two runs of a scenario produce
      #     byte-identical event logs. A build that is not reproducible while
      #     the runs are is an odd claim to leave standing, and the fix is one
      #     environment variable: SOURCE_DATE_EPOCH pins the timestamps the zip
      #     format would otherwise take from the clock.
      #
      #     The epoch is this commit's own author date, so it is a function of
      #     the source rather than of when somebody pressed the button.
      - name: Step 9b, build every brick reproducibly
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          uv build --all-packages --out-dir dist
          uv build --all-packages --out-dir dist-verify
          for artifact in dist/*; do
            name=$(basename "$artifact")
            if ! cmp -s "$artifact" "dist-verify/$name"; then
              echo "::error::$name is not reproducible: two builds of one commit differ"
              exit 1
            fi
          done
          echo "reproducible: $(find dist -type f | wc -l) artifacts identical across two builds"
          rm -rf dist-verify

      # 9c. SLSA v1 Build Level 3 provenance, one attestation per artifact.
      #     Verifiable afterwards with:
      #         gh attestation verify <wheel> --repo ${{ github.repository }}
      - name: Step 9c, attest the build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      # 10. The CHANGELOG section for this tag, and the semver bump policy.
      - name: Step 10, release gate
        run: just release-check "$VERSION"

      - name: Stop here on a dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: every check above passed. Nothing was tagged, published, or closed."
          echo "Re-run with dry_run false to cut v$VERSION."

      # 11. Tag, release, and the milestone lifecycle. Issue mutation is not
      #     performed here: .roadmap-sync.yaml allows this context to create and
      #     close milestones and nothing else.
      - name: Step 11, tag and publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the CHANGELOG section for this tag, not a
          # second description of the same release written by hand.
          awk -v version="## [$VERSION]" '
            index($0, version) == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            dist/* sbom.cdx.json

      # The publisher has to be configured on PyPI before the first upload, and
      # it is a separate input rather than a consequence of dry_run so the first
      # tag can be cut before that exists. A publish that fails after the tag is
      # pushed leaves a released version nobody can install.
      - name: Step 11b, publish to PyPI
        if: ${{ !inputs.dry_run && inputs.publish }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          # PEP 740 attestations, on by default under trusted publishing. Named
          # rather than left to the default, because the difference between
          # "we get them" and "we asked for them" is the difference between a
          # property and an assumption.
          attestations: true

      # 11b2. Read the attestation back off PyPI through the Integrity API.
      #       An attestation nobody fetched is an attestation nobody knows
      #       arrived, and PEP 740 publishes the endpoint precisely so the
      #       claim can be checked from outside the pipeline that made it.
      - name: Step 11b2, verify the PyPI attestation exists
        if: ${{ !inputs.dry_run && inputs.publish }}
        run: |
          missing=0
          for wheel in dist/*.whl; do
            name=$(basename "$wheel")
            project=$(echo "$name" | cut -d- -f1 | tr '_' '-')
            url="https://pypi.org/integrity/$project/$VERSION/$name/provenance"
            code=$(curl -sS -o /tmp/provenance.json -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "attested: $name"
            else
              echo "::error::no PEP 740 provenance at $url (HTTP $code)"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]

      # 11c. Milestone lifecycle only. --context release-workflow is what
      #      .roadmap-sync.yaml allows this job to apply: it may create and
      #      describe a milestone and it may not touch an issue. Issue mutation
      #      waits for a human running `just roadmap sync --apply` from a
      #      checkout, and the sync refuses it here rather than being trusted
      #      not to try.
      - name: Step 11c, project the roadmap onto the tracker
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run twinflow-roadmap sync --apply --context release-workflow

      # 12. The release record. ops.release.tagged.v1 is published once the ops
      #     schema subjects exist; until then the same fields are written as a
      #     build artifact so the numbers are recorded either way.
      #
      #     The gate list is read from the registry rather than written here. A
      #     hand-written list is a list that goes stale: this one had seven
      #     entries while the phase ran twelve gates, so the record understated
      #     what the release proved.
      - name: Step 12, write the release record
        env:
          RELEASE_PHASE: ${{ steps.phase.outputs.id }}
        run: |
          {
            echo "tag: v$VERSION"
            echo "commit_sha: $COMMIT_SHA"
            echo "dry_run: $DRY_RUN"
            echo "runner_label: ubuntu-24.04"
            echo "runner_image_version: ${ImageVersion:-unknown}"
            echo "phase: $RELEASE_PHASE"
            echo "gates_run:"
            uv run twinflow-roadmap gates --phase "$RELEASE_PHASE"               | awk 'NR > 1 { print "  - " $1 }'
            echo "note: >-"
            echo "  ops.release.tagged.v1 publishes once the /schemas/ops subjects land."
          } > release-record.yaml
          cat release-record.yaml

      - name: Upload the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-v${{ inputs.version }}
          path: |
            dist
            sbom.cdx.json
            release-record.yaml
          if-no-files-found: error
