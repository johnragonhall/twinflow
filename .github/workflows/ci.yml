name: CI

# Build, type-check, and test on every push and pull request. This is the
# workflow behind the CI badge in the README.
#
# CI COST NOTE (deliberate divergence)
# -----------------------------------
# A private upstream monorepo carries a cost guard that blocks GitHub-hosted
# workflows and pins CI to a self-hosted runner, because that repository is
# private and Actions minutes are billed against the account.
#
# twinflow is public. GitHub Actions is free for public repositories on
# standard runners, and a passing CI badge is an explicit requirement for this
# project, so these jobs run GitHub-hosted on purpose. Do not "fix" this by
# pointing them at a self-hosted runner: that would trade a public, verifiable
# build for a private one and break the badge for anyone reading the repo.
#
# WALL-TIME BUDGET
# ----------------
# Target: under 10 minutes wall time for a full run. The Python matrix legs are
# the long pole at roughly 4 minutes each and run in parallel; the Rust agent
# leg is roughly 5 minutes cold and under 2 warm. Path filters keep an
# unrelated change from paying for either. If a leg drifts past its budget,
# move work into a nightly workflow rather than letting the badge go slow.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every `run:` body here is POSIX shell, and steps read their inputs as
# environment variables rather than interpolating them, so that a workflow
# expression never becomes shell source. On a Windows runner the default shell
# is PowerShell, where `"$PYTHON_VERSION"` names an undefined PowerShell
# variable instead of the environment, and the step receives an empty string.
# Declaring bash once holds every leg of the matrix to the one shell the
# scripts are written in.
defaults:
  run:
    shell: bash

# A newer push on the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter. Each downstream job runs only when files it actually covers
  # changed, so a docs-only commit costs one cheap job instead of the matrix.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      agent: ${{ steps.filter.outputs.agent }}
      roadmap: ${{ steps.filter.outputs.roadmap }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checkout token is not needed past this step, and a
          # workspace that still holds it leaks it into any artifact
          # uploaded later.
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Every line of Python this project ships lands under packages/**,
            # and justfile is the task entry point. A path missing from this
            # list skips the job for a pull request that touches only that
            # path, and the aggregate ci job treats a skipped job as success,
            # so the badge stays green over a matrix that never ran.
            python:
              - 'packages/**'
              - 'tools/**'
              - 'scripts/**'
              - 'tests/**'
              - 'scenarios/**'
              - 'justfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            # agent/** alone, and no workflow path. A workflow path here
            # starts a Rust build for any change to the Python legs, against
            # a directory that arrives with the device agent at P3 (R33).
            agent:
              - 'agent/**'
            # The roadmap is data, and a change to the data or to the diagram
            # it renders is a change the coverage proof has to see. Without
            # this filter an edit to ROADMAP.md alone skips every job, and the
            # badge stays green over a plan that does not validate.
            roadmap:
              - 'roadmap.yaml'
              - 'requirements.yaml'
              - 'splits.yaml'
              - 'gates.yaml'
              - '.roadmap-sync.yaml'
              - 'ROADMAP.md'
              - 'tools/roadmap/**'
              - '.github/workflows/ci.yml'

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor and 3.13 is the primary. Both are supported for the
        # lifetime of their upstream security window.
        python-version: ["3.12", "3.13"]
        # repo-craft 1065 puts py3.12 on windows in the unit job, and DET-002
        # asserts agreement across platforms rather than across interpreters:
        # two interpreters on one image cannot measure that. Declared in full
        # and cut back by exclude, rather than added by include, so the cells
        # this file names are the cells ci_budget.yaml records.
        os: ["ubuntu-24.04", "windows-2022"]
        exclude:
          - os: windows-2022
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The unit tier runs two checks that read the commit history: the
          # commit-message gate over every commit, which refuses a shallow
          # clone outright, and the append-only test that walks each commit
          # touching requirements.yaml. A depth-1 checkout hands both one
          # commit with no parent, which is a range nothing could fail.
          fetch-depth: 0
          # The checkout token is not needed past this step, and a
          # workspace that still holds it leaks it into any artifact
          # uploaded later.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Sync dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --all-extras --dev --python "$PYTHON_VERSION"

      # Every step below is a recipe call, so local and CI cannot drift. Without
      # this install those calls produce "just: command not found" on the first
      # line of the first leg.
      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The static battery is the reference platform's job. A shell gate,
      # markdownlint, shellcheck and actionlint all read the same tracked bytes
      # whatever runs them, so a second platform re-reading them buys nothing
      # and costs a toolchain that has to exist there.
      - name: Lint
        if: runner.os == 'Linux'
        run: just lint

      - name: Type check
        if: runner.os == 'Linux'
        run: just typecheck

      - name: Unit tier
        run: just test

      # Property-based invariants run on every matrix leg: a bound that holds on
      # one interpreter and not another is exactly the kind of bug they exist
      # to catch.
      - name: Property invariants
        if: runner.os == 'Linux'
        run: just test-property

      - name: Determinism
        run: just determinism

      # DET-002 tier two. Each leg records the same scenario at the same seed,
      # and the divergence job below compares them. Recording here rather than
      # comparing here, because a leg cannot read another leg's filesystem.
      - name: Record the SCN-F1 run for this leg
        env:
          LEG: ${{ runner.os }}-py${{ matrix.python-version }}
        run: just record-run "run-$LEG.jsonl" 0

      - name: Upload this leg's run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run-${{ runner.os }}-py${{ matrix.python-version }}
          path: run-${{ runner.os }}-py${{ matrix.python-version }}.jsonl
          if-no-files-found: error

      # The reference runner's image version, which ci_budget.yaml records as
      # null until a run reports one. Printed rather than written back: a
      # workflow that committed to the repository would need write access for a
      # number a human should read before pinning it.
      - name: Report the runner image version
        if: matrix.python-version == '3.13'
        run: |
          echo "observed ImageVersion: ${ImageVersion:-unknown}"
          grep image_version ci_budget.yaml

  # DET-002, both halves of tier two.
  #
  # Across interpreters on one image: catches an interpreter-dependent
  # iteration order or float repr. Across operating systems at one interpreter:
  # catches a path separator, a line ending, a locale, and a libm that rounds
  # its last bit differently, which is the comparison the tier is named for.
  #
  # No tolerance is passed. gates.yaml records this noise floor as not yet
  # measured, so the job publishes the divergence it observed and bounds
  # nothing. A business event that differs still fails it.
  divergence:
    name: Cross-platform divergence
    needs: [changes, python]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checkout token is not needed past this step, and a
          # workspace that still holds it leaks it into any artifact
          # uploaded later.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Download every leg's run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: run-*
          merge-multiple: true

      - name: Compare the interpreters, one operating system
        run: |
          uv run python tools/compare_runs.py \
            run-Linux-py3.12.jsonl run-Linux-py3.13.jsonl \
            --label-left "linux python 3.12" --label-right "linux python 3.13"

      # The comparison the gate is named for. Both legs run the same seed and
      # the same config, so a divergence here is the platform and nothing else.
      - name: Compare the operating systems, one interpreter
        run: |
          uv run python tools/compare_runs.py \
            run-Linux-py3.12.jsonl run-Windows-py3.12.jsonl \
            --label-left "linux python 3.12" --label-right "windows python 3.12"

  roadmap:
    name: Roadmap gate
    needs: changes
    if: needs.changes.outputs.roadmap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checkout token is not needed past this step, and a
          # workspace that still holds it leaks it into any artifact
          # uploaded later.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # VAL-GATE-RMAP-001. The tracker half of drift needs a token, so the
      # offline half runs here and the release workflow runs the full one.
      - name: Roadmap gate
        run: just roadmap-gate

  agent:
    name: Rust device agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checkout token is not needed past this step, and a
          # workspace that still holds it leaks it into any artifact
          # uploaded later.
          persist-credentials: false

      # The same guard scripts/ci-local.sh applies, for the same reason: the
      # Rust device agent lands at P3, and until then `cd agent` is a failure
      # that says nothing about the change under test.
      - name: Is there an agent to build
        id: agent
        run: |
          if [ -f agent/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: no agent/Cargo.toml. The Rust device agent arrives at P3."
          fi

      - name: Install Rust stable
        if: steps.agent.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        if: steps.agent.outputs.present == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent

      - name: Format check
        if: steps.agent.outputs.present == 'true'
        run: cd agent && cargo fmt --check

      - name: Clippy
        if: steps.agent.outputs.present == 'true'
        run: cd agent && cargo clippy --all-targets -- -D warnings

      - name: Tests
        if: steps.agent.outputs.present == 'true'
        run: cd agent && cargo test

  # Stable status check for branch protection and the README badge. It succeeds
  # when every job that ran succeeded, and when a path filter skipped a job it
  # treats that as success rather than failure.
  ci:
    name: CI
    if: always()
    needs: [changes, python, divergence, roadmap, agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          # Through the environment rather than into the script text. A job
          # result is a fixed vocabulary today, and a `run:` block that
          # expands any expression is a habit rather than a safe case.
          RESULTS: >-
            changes=${{ needs.changes.result }}
            python=${{ needs.python.result }}
            divergence=${{ needs.divergence.result }}
            roadmap=${{ needs.roadmap.result }}
            agent=${{ needs.agent.result }}
        run: |
          for result in $RESULTS
          do
            name=${result%%=*}
            state=${result#*=}
            echo "$name: $state"
            case "$state" in
              success|skipped) ;;
              *) echo "::error::job $name reported $state"; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped by a path filter."
